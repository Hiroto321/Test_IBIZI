name: Monthly Repository Backup

on:
  schedule:
    # Запуск 1-го числа каждого месяца в 00:00 UTC
    - cron: '0 0 1 * *'
  
  # Возможность запустить вручную для теста
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (полный клон со всей историей)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Скачиваем ВСЕ коммиты, ветки и теги

      - name: Create backup archive
        run: |
          echo "Создаём резервную копию..."
          tar -czf backup-$(date +%Y-%m-%d).tar.gz .
          echo "Архив создан: backup-$(date +%Y-%m-%d).tar.gz"
          ls -lh backup-*.tar.gz

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-backup
          path: backup-*.tar.gz
          retention-days: 90  # Храним бэкап 90 дней

      - name: Backup completed
        run: |
          echo "✅ Резервное копирование завершено успешно!"
          echo "Дата: $(date)"
          echo "Размер архива: $(du -sh backup-*.tar.gz | cut -f1)"
